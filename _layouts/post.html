---
layout: default
---

<div class="page-header">
    <h1>{{ page.title }}</h1>
    <p>{{ page.date | date: "%B %-d, %Y" }}{% if page.tags.size > 0 %} &bull; {% for tag in page.tags %}{{ tag }}{% unless forloop.last %}, {% endunless %}{% endfor %}{% endif %}</p>
</div>

<main class="site-main">
    <div class="card">
        {{ content }}
    </div>
    <p><a href="/news/" class="btn btn-brown">&larr; Back to News &amp; Events</a></p>
</main>
