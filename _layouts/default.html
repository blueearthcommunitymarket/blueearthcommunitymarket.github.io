<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | Blue Earth Community Market{% else %}Blue Earth Community Market{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cream: #f7f3ec;
            --warm-white: #fdfaf5;
            --brown-dark: #3b2a1a;
            --brown-mid: #6b4c2a;
            --brown-light: #a07850;
            --green-dark: #3d5a2e;
            --green-mid: #5a7a40;
            --green-light: #8aaa6a;
            --gold: #c8a04a;
            --border: #c4a87a;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--cream);
            color: var(--brown-dark);
            line-height: 1.7;
        }

        /* NAV */
        .site-nav {
            background-color: var(--brown-dark);
            padding: 0 20px;
        }

        .nav-inner {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .nav-logo img {
            height: 44px;
            width: 44px;
            object-fit: contain;
            border-radius: 4px;
        }

        .nav-logo-text {
            font-family: 'Playfair Display', serif;
            color: var(--cream);
            font-size: 1rem;
            line-height: 1.2;
        }

        .nav-links {
            display: flex;
            gap: 6px;
            list-style: none;
        }

        .nav-links a {
            color: var(--cream);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            background: var(--brown-mid);
            color: var(--gold);
        }

        /* HERO (homepage only) */
        .hero {
            background: var(--brown-dark);
            color: var(--cream);
            text-align: center;
            padding: 70px 20px 60px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('/assets/logo.jpg') center/cover no-repeat;
            opacity: 0.06;
        }

        .hero-inner {
            position: relative;
            max-width: 700px;
            margin: 0 auto;
        }

        .hero img.hero-logo {
            width: 200px;
            height: 200px;
            object-fit: contain;
            margin-bottom: 24px;
            filter: drop-shadow(0 4px 16px rgba(0,0,0,0.4));
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            margin-bottom: 10px;
            color: var(--cream);
        }

        .hero .hero-sub {
            font-size: 1.15rem;
            color: var(--gold);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .hero .hero-desc {
            font-size: 1.05rem;
            color: #d4c9b8;
            max-width: 520px;
            margin: 0 auto 28px;
        }

        .hero-buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* MAIN CONTENT */
        .site-main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        /* PAGE HEADER (non-hero pages) */
        .page-header {
            background: var(--brown-dark);
            color: var(--cream);
            padding: 42px 20px 36px;
            text-align: center;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--cream);
        }

        .page-header p {
            color: var(--gold);
            margin-top: 8px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }

        /* CARDS / SECTIONS */
        .card {
            background: var(--warm-white);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 32px;
            margin-bottom: 28px;
        }

        .card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--brown-dark);
            margin-bottom: 12px;
        }

        .card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--brown-mid);
            margin: 18px 0 8px;
        }

        .card p {
            color: #4a3828;
            margin-bottom: 10px;
        }

        .card ul {
            padding-left: 20px;
            color: #4a3828;
        }

        .card ul li {
            margin-bottom: 6px;
        }

        .section-label {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--green-mid);
            margin-bottom: 6px;
        }

        /* 2-COL GRID */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 640px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        /* BUTTONS */
        .btn {
            display: inline-block;
            padding: 12px 26px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 0.04em;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--green-dark);
            color: var(--cream);
            border: 2px solid var(--green-dark);
        }

        .btn-primary:hover {
            background: var(--green-mid);
            border-color: var(--green-mid);
        }

        .btn-outline {
            background: transparent;
            color: var(--cream);
            border: 2px solid var(--cream);
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.15);
        }

        .btn-brown {
            background: var(--brown-mid);
            color: var(--cream);
            border: 2px solid var(--brown-mid);
        }

        .btn-brown:hover {
            background: var(--brown-dark);
            border-color: var(--brown-dark);
        }

        /* DIVIDER */
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 32px 0;
        }

        /* TAG */
        .tag {
            display: inline-block;
            background: var(--green-light);
            color: var(--brown-dark);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 20px;
            margin-right: 6px;
            margin-bottom: 6px;
        }

        .tag-gold {
            background: var(--gold);
        }

        /* BLOG POST LIST */
        .post-list {
            list-style: none;
        }

        .post-list li {
            border-bottom: 1px solid var(--border);
            padding: 22px 0;
        }

        .post-list li:last-child {
            border-bottom: none;
        }

        .post-meta {
            font-size: 0.82rem;
            color: var(--brown-light);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 6px;
        }

        .post-list h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            margin-bottom: 6px;
        }

        .post-list h3 a {
            color: var(--brown-dark);
            text-decoration: none;
        }

        .post-list h3 a:hover {
            color: var(--green-dark);
        }

        .post-list p {
            color: #5a4535;
            font-size: 0.97rem;
        }

        /* CALENDAR TABLE */
        .calendar-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.97rem;
        }

        .calendar-table th {
            background: var(--brown-dark);
            color: var(--cream);
            font-family: 'Playfair Display', serif;
            padding: 12px 16px;
            text-align: left;
        }

        .calendar-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            color: #4a3828;
        }

        .calendar-table tr:last-child td {
            border-bottom: none;
        }

        .calendar-table tr:nth-child(even) td {
            background: #f3ede3;
        }

        .calendar-table .market-date {
            font-weight: 700;
            color: var(--brown-dark);
            white-space: nowrap;
        }

        .calendar-table .grand-opening {
            color: var(--green-dark);
            font-weight: 700;
        }

        /* FACEBOOK SECTION */
        .fb-section {
            background: var(--warm-white);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 32px;
            text-align: center;
        }

        .fb-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            margin-bottom: 10px;
        }

        .fb-section p {
            color: #4a3828;
            margin-bottom: 20px;
        }

        .fb-embed-wrap {
            display: flex;
            justify-content: center;
        }

        /* FORM */
        .form-field {
            margin-bottom: 20px;
        }

        .form-field label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--brown-dark);
            font-size: 0.95rem;
        }

        .form-field input,
        .form-field select,
        .form-field textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            font-family: 'Lato', sans-serif;
            font-size: 0.97rem;
            color: var(--brown-dark);
        }

        .form-field textarea {
            min-height: 110px;
            resize: vertical;
        }

        .form-field input:focus,
        .form-field select:focus,
        .form-field textarea:focus {
            outline: 2px solid var(--green-mid);
            border-color: var(--green-mid);
        }

        .form-note {
            font-size: 0.85rem;
            color: var(--brown-light);
            margin-top: 5px;
        }

        .form-submit {
            margin-top: 10px;
        }

        /* HIGHLIGHT BOX */
        .highlight-box {
            background: var(--green-dark);
            color: var(--cream);
            border-radius: 10px;
            padding: 28px 32px;
            margin-bottom: 28px;
        }

        .highlight-box h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--cream);
            margin-bottom: 8px;
        }

        .highlight-box p {
            color: #c8ddaa;
        }

        .highlight-box a {
            color: var(--gold);
        }

        /* FOOTER */
        .site-footer {
            background: var(--brown-dark);
            color: var(--cream);
            text-align: center;
            padding: 36px 20px;
            margin-top: 20px;
        }

        .site-footer p {
            font-size: 0.92rem;
            opacity: 0.85;
            margin-bottom: 4px;
        }

        .site-footer .footer-links {
            margin-top: 14px;
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .site-footer .footer-links a {
            color: var(--gold);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 700;
        }

        .site-footer .footer-links a:hover {
            text-decoration: underline;
        }

        /* RESPONSIVE NAV */
        @media (max-width: 640px) {
            .nav-links a {
                font-size: 0.78rem;
                padding: 5px 8px;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero img.hero-logo {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <nav class="site-nav">
        <div class="nav-inner">
            <a href="/" class="nav-logo">
                <img src="/assets/logo.jpg" alt="Blue Earth Community Market logo">
                <span class="nav-logo-text">Blue Earth<br>Community Market</span>
            </a>
            <ul class="nav-links">
                <li><a href="/" {% if page.url == '/' %}class="active"{% endif %}>Home</a></li>
                <li><a href="/news/" {% if page.url contains '/news' %}class="active"{% endif %}>News</a></li>
                <li><a href="/calendar/" {% if page.url contains '/calendar' %}class="active"{% endif %}>Calendar</a></li>
                <li><a href="/vendors/" {% if page.url contains '/vendors' %}class="active"{% endif %}>Vendors</a></li>
            </ul>
        </div>
    </nav>

    {{ content }}

    <footer class="site-footer">
        <p><strong>Blue Earth Community Market</strong></p>
        <p>112 S Grove St, Blue Earth, Minnesota</p>
        <p>Saturdays 10a–1p, May through October</p>
        <div class="footer-links">
            <a href="https://www.facebook.com/share/1BiTzAtMjP/?mibextid=wwXIfr" target="_blank" rel="noopener">Facebook</a>
            <a href="/vendors/">Vendor Signup</a>
            <a href="/calendar/">Market Calendar</a>
            <a href="mailto:info@blueearthcommunitymarket.com">info@blueearthcommunitymarket.com</a>
        </div>
    </footer>
</body>
</html>
